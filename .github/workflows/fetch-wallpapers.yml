name: Fetch Kawaii Wallpapers

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write 

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scripts/fetch_wallpapers.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update wallpapers and json database"
          # Commits all subdirectories in wallpapers/ AND the wallpapers.json file
          file_pattern: "wallpapers/** wallpapers.json"